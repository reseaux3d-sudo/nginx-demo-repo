name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nginx-demo-repo:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: reseaux3d-sudo/mon-repo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repository
        run: |
          sed -i "s|image: ghcr.io/reseaux3d-sudo/nginx-demo-repo:.*|image: ghcr.io/reseaux3d-sudo/nginx-demo-repo:${{ github.sha }}|" gitops/nginx/deployment.yaml

      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nginx/deployment.yaml
          git commit -m "Update nginx image to ${{ github.sha }}"
          git push
